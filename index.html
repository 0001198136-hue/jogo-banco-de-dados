<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quiz - Ligar Pergunta e Resposta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 32px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; text-align: center; }
  #status { color: #aaa; margin-bottom: 16px; font-size: 0.95rem; text-align: center; }

  /* ---- Cérebro ---- */
  #brain-wrap {
    width: 100%;
    max-width: 260px;
    margin: 4px 0 18px;
    display: flex;
    justify-content: center;
  }
  #brain-wrap svg { width: 100%; height: auto; display: block; }
  .brain-region {
    fill: #2d2d4a;
    stroke: #44446a;
    stroke-width: 2;
    transition: fill 0.5s ease, filter 0.5s ease;
  }
  .brain-region.lit {
    fill: #3ddc84;
    filter: drop-shadow(0 0 6px #3ddc84);
  }
  .brain-region.lit.pulse {
    animation: brainPulse 0.6s ease;
  }
  @keyframes brainPulse {
    0% { filter: drop-shadow(0 0 2px #3ddc84); transform: scale(1); }
    40% { filter: drop-shadow(0 0 14px #3ddc84); transform: scale(1.06); }
    100% { filter: drop-shadow(0 0 6px #3ddc84); transform: scale(1); }
  }

  #board {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 700px;
    justify-content: center;
  }
  .col { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .col h2 { font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 4px; text-align: center; }
  .card {
    background: #2d2d4a;
    border: 2px solid #44446a;
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    font-size: 0.95rem;
    text-align: center;
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
    user-select: none;
    word-break: break-word;
  }
  .card:hover { border-color: #6a6aa8; }
  .card.selected {
    border-color: #ffd23f;
    background: #3d3d63;
    transform: scale(1.03);
  }
  .card.correct {
    background: #1e6b3f;
    border-color: #3ddc84;
    cursor: default;
    opacity: 0.85;
  }
  .card.wrong {
    animation: shake 0.35s;
    border-color: #e0483e;
  }
  .card.disabled { pointer-events: none; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #restart {
    margin-top: 28px;
    background: #ffd23f;
    color: #1a1a2e;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.95rem;
    display: none;
  }
  #restart:active { transform: scale(0.97); }
  #win {
    margin-top: 20px;
    font-size: 1.3rem;
    color: #3ddc84;
    font-weight: bold;
    text-align: center;
    display: none;
  }

  /* ---- Responsivo para celular ---- */
  @media (max-width: 480px) {
    body { padding: 14px 8px 28px; }
    h1 { font-size: 1.15rem; }
    #status { font-size: 0.85rem; margin-bottom: 12px; }
    #brain-wrap { max-width: 180px; margin-bottom: 14px; }
    #board { gap: 8px; }
    .col { gap: 7px; }
    .col h2 { font-size: 0.7rem; margin-bottom: 2px; }
    .card {
      padding: 9px 5px;
      font-size: 0.78rem;
      border-radius: 8px;
      line-height: 1.25;
    }
    #restart { padding: 9px 20px; font-size: 0.9rem; margin-top: 20px; }
    #win { font-size: 1.1rem; }
  }

  @media (max-width: 360px) {
    .card { font-size: 0.72rem; padding: 8px 4px; }
    #board { gap: 6px; }
  }
</style>
</head>
<body>

<h1>Ligue a Pergunta à Resposta</h1>
<div id="status">Clique numa pergunta, depois na resposta certa</div>

<div id="brain-wrap">
  <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
    <g id="brain-regions">
      <path class="brain-region" data-idx="0" d="M100 12 C70 12 55 25 50 40 C45 40 38 48 40 58 C36 62 34 70 40 78 L60 78 L65 45 C75 30 90 20 100 20 Z"/>
      <path class="brain-region" data-idx="1" d="M100 12 C130 12 145 25 150 40 C155 40 162 48 160 58 C164 62 166 70 160 78 L140 78 L135 45 C125 30 110 20 100 20 Z"/>
      <path class="brain-region" data-idx="2" d="M40 58 C34 66 32 78 38 90 L58 92 L60 78 L40 78 Z"/>
      <path class="brain-region" data-idx="3" d="M160 58 C166 66 168 78 162 90 L142 92 L140 78 L160 78 Z"/>
      <path class="brain-region" data-idx="4" d="M38 90 C36 104 42 118 55 126 L68 108 L58 92 Z"/>
      <path class="brain-region" data-idx="5" d="M162 90 C164 104 158 118 145 126 L132 108 L142 92 Z"/>
      <path class="brain-region" data-idx="6" d="M55 126 C64 140 82 150 100 150 L100 112 L68 108 Z"/>
      <path class="brain-region" data-idx="7" d="M145 126 C136 140 118 150 100 150 L100 112 L132 108 Z"/>
    </g>
  </svg>
</div>

<div id="board">
  <div class="col">
    <h2>Perguntas</h2>
    <div id="questions"></div>
  </div>
  <div class="col">
    <h2>Respostas</h2>
    <div id="answers"></div>
  </div>
</div>
<div id="win">🎉 Você acertou todas!</div>
<button id="restart">Jogar de novo</button>

<script>
// ---- EDITE AQUI: suas perguntas e respostas ----
const PAIRS = [
  { q: "Formato em que o MongoDB armazena os documentos", a: "JSON/BSON" },
  { q: "Equivalente de 'Tabela' no MongoDB", a: "Coleção (Collection)" },
  { q: "Equivalente de 'Linha/Registro' no MongoDB", a: "Documento (Document)" },
  { q: "Equivalente de 'Coluna' no MongoDB", a: "Campo (Field)" },
  { q: "Principal vantagem do schema flexível", a: "Adicionar campos sem migrar o schema" },
  { q: "Principal desvantagem de agrupar dados no documento", a: "Duplicação de dados" },
  { q: "Cenário em que é melhor evitar bancos de documentos", a: "Transações ACID complexas" },
  { q: "Caso de uso ideal para bancos de documentos", a: "E-commerce / catálogos variados" },
];
// --------------------------------------------------

let selectedQ = null;
let matched = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function resetBrain() {
  document.querySelectorAll('.brain-region').forEach(r => {
    r.classList.remove('lit', 'pulse');
  });
}

function lightNextBrainRegion() {
  const regions = document.querySelectorAll('.brain-region');
  // acende as regiões na ordem em que aparecem no SVG, uma por acerto
  const region = regions[matched - 1];
  if (region) {
    region.classList.add('lit', 'pulse');
    setTimeout(() => region.classList.remove('pulse'), 600);
  }
}

function buildBoard() {
  matched = 0;
  selectedQ = null;
  resetBrain();
  document.getElementById('win').style.display = 'none';
  document.getElementById('restart').style.display = 'none';
  document.getElementById('status').textContent = 'Clique numa pergunta, depois na resposta certa';

  const qCol = document.getElementById('questions');
  const aCol = document.getElementById('answers');
  qCol.innerHTML = '';
  aCol.innerHTML = '';

  const questionsShuffled = shuffle(PAIRS.map((p, i) => ({ ...p, id: i })));
  const answersShuffled = shuffle(PAIRS.map((p, i) => ({ ...p, id: i })));

  questionsShuffled.forEach(p => {
    const el = document.createElement('div');
    el.className = 'card';
    el.textContent = p.q;
    el.dataset.id = p.id;
    el.addEventListener('click', () => selectQuestion(el, p.id));
    qCol.appendChild(el);
  });

  answersShuffled.forEach(p => {
    const el = document.createElement('div');
    el.className = 'card';
    el.textContent = p.a;
    el.dataset.id = p.id;
    el.addEventListener('click', () => selectAnswer(el, p.id));
    aCol.appendChild(el);
  });
}

function selectQuestion(el, id) {
  if (el.classList.contains('correct')) return;
  document.querySelectorAll('#questions .card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedQ = { el, id };
}

function selectAnswer(el, id) {
  if (el.classList.contains('correct')) return;
  if (!selectedQ) {
    document.getElementById('status').textContent = 'Selecione uma pergunta primeiro';
    return;
  }
  if (selectedQ.id === id) {
    selectedQ.el.classList.remove('selected');
    selectedQ.el.classList.add('correct', 'disabled');
    el.classList.add('correct', 'disabled');
    matched++;
    lightNextBrainRegion();
    document.getElementById('status').textContent = `${matched} de ${PAIRS.length} acertadas`;
    selectedQ = null;
    if (matched === PAIRS.length) {
      document.getElementById('win').style.display = 'block';
      document.getElementById('restart').style.display = 'block';
      document.getElementById('status').textContent = '';
    }
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 350);
  }
}

document.getElementById('restart').addEventListener('click', buildBoard);

buildBoard();
</script>

</body>
</html>
