<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Conecta MongoDB</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  #setup-screen{ width:100%; max-width:380px; }
  #setup-screen .card{ text-align:center; }
  #setup-screen input{ margin:18px 0; }

  #game-screen{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:14px;
    touch-action:none;
  }
  #topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  #topbar .pill{ font-size:.7rem; }
  #timer{ font-variant-numeric: tabular-nums; font-weight:700; color:var(--blue); }

  #board{
    position:relative;
    flex:1;
    display:flex;
    justify-content:space-between;
    gap:8px;
  }
  #wires{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .col{ display:flex; flex-direction:column; gap:10px; width:47%; }
  .node{
    position:relative;
    background: var(--bg-card);
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 10px;
    font-size:.82rem;
    line-height:1.25;
    user-select:none;
    -webkit-user-select:none;
    transition: border-color .15s, background .15s;
  }
  .col-q .node{ padding-right:22px; }
  .col-a .node{ padding-left:22px; }
  .dot{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    border-radius:50%;
    background: var(--border);
    border:2px solid var(--text-dim);
  }
  .col-q .dot{ right:-7px; }
  .col-a .dot{ left:-7px; }

  .node.correct{ border-color: var(--teal); background: rgba(45,212,167,.12); }
  .node.correct .dot{ background: var(--teal); border-color: var(--teal); }
  .node.wrong{ border-color: var(--red); background: rgba(244,63,94,.15); }
  .node.dragging{ border-color: var(--blue); }

  #progress-label{ text-align:center; margin-top:10px; color:var(--text-dim); font-size:.85rem; }

  #finish-screen .card{ text-align:center; max-width:380px; }
  #finish-time{ font-size:2.4rem; font-weight:800; color:var(--teal); margin:10px 0; }
</style>
</head>
<body>

<!-- Tela 1: entrar -->
<div id="setup-screen" class="center-screen">
  <div class="card">
    <span class="pill">🧠 Conecta MongoDB</span>
    <h2 style="margin-top:14px;">Ligue as perguntas às respostas certas</h2>
    <p style="color:var(--text-dim);">Arraste o fio do lado esquerdo até a resposta certa do lado direito. O mais rápido a acertar tudo fica no pódio!</p>
    <input class="text" id="name-input" placeholder="Seu nome" maxlength="20" />
    <button class="btn" id="start-btn" style="width:100%;">Entrar no jogo</button>
  </div>
</div>

<!-- Tela 2: jogo -->
<div id="game-screen" class="hidden">
  <div id="topbar">
    <span class="pill">Conecta MongoDB</span>
    <span id="timer">0.0s</span>
  </div>
  <div id="board">
    <svg id="wires"></svg>
    <div class="col col-q" id="col-questions"></div>
    <div class="col col-a" id="col-answers"></div>
  </div>
  <div id="progress-label">0 / 0 ligados</div>
</div>

<!-- Tela 3: fim -->
<div id="finish-screen" class="center-screen hidden">
  <div class="card">
    <span class="pill">🏁 Terminou!</span>
    <div id="finish-time">0.0s</div>
    <p style="color:var(--text-dim);">Confere o pódio no telão.</p>
  </div>
</div>

<script type="module" src="js/player.js"></script>
</body>
</html>
