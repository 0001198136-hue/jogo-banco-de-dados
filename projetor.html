<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conecta Ideias — Projetor</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="projetor">
  <div class="projetor-topo">
    <h1 id="titulo-projetor">Conecta Ideias — aguardando início</h1>
    <div id="countdown-sessao" class="projetor-countdown">--:--</div>
  </div>

  <div class="projetor-corpo">
    <div id="grid-cerebros" class="grid-cerebros"></div>
    <div class="painel-ranking">
      <h2>Ranking</h2>
      <ul id="ranking-lista"></ul>
    </div>
  </div>

  <script type="module">
    import { buscarSessaoAtiva, supabase } from '/src/supabaseClient.js';
    import {
      abrirCanalSessao, onProgresso, onFinalizado, enviarFreeze,
      assinarPlayersFinalizados, iniciarPollingPlayers,
    } from '/src/realtime.js';
    import { calcularOffset, criarCountdownSessao, formatarMMSS } from '/src/timer.js';
    import { renderizarRanking } from '/src/leaderboard.js';

    const $ = (sel) => document.querySelector(sel);
    const players = new Map(); // id -> { nome, progresso, finalizado, tempo_final }
    let congelado = false;

    function mergePlayer(id, patch) {
      players.set(id, { ...(players.get(id) || { nome: 'Jogador', progresso: 0, finalizado: false }), ...patch });
      renderTudo();
    }

    function renderTudo() {
      const lista = Array.from(players.entries()).map(([id, p]) => ({ id, ...p }));
      renderizarGrid(lista);
      renderizarRanking($('#ranking-lista'), lista, { congelado });
    }

    function renderizarGrid(lista) {
      const container = $('#grid-cerebros');
      lista
        .sort((a, b) => a.nome.localeCompare(b.nome))
        .forEach((p) => {
          let card = container.querySelector(`[data-player-id="${p.id}"]`);
          if (!card) {
            card = document.createElement('div');
            card.className = 'mini-cerebro';
            card.dataset.playerId = p.id;
            card.innerHTML = `<span class="nome"></span><div class="barra-fundo"><div class="barra"></div></div>`;
            container.appendChild(card);
          }
          card.querySelector('.nome').textContent = p.nome;
          card.querySelector('.barra').style.width = `${p.finalizado ? 100 : p.progresso}%`;
          card.classList.toggle('finalizado', !!p.finalizado);
        });
    }

    async function esperarSessao() {
      return new Promise((resolve) => {
        const tick = async () => {
          const s = await buscarSessaoAtiva();
          if (s?.started_at) { clearInterval(id); resolve(s); }
        };
        const id = setInterval(tick, 2000);
        tick();
      });
    }

    async function main() {
      const session = await esperarSessao();
      $('#titulo-projetor').textContent = 'Conecta Ideias';

      const { data: iniciais } = await supabase.from('players').select('*').eq('session_id', session.id);
      (iniciais || []).forEach((p) => players.set(p.id, {
        nome: p.nome, progresso: p.finalizado ? 100 : 0, finalizado: p.finalizado, tempo_final: p.tempo_final,
      }));
      renderTudo();

      const offset = await calcularOffset();
      const startedAtMs = new Date(session.started_at).getTime();
      const channel = abrirCanalSessao(session.id);

      onProgresso(channel, ({ playerId, progresso }) => mergePlayer(playerId, { progresso }));
      onFinalizado(channel, ({ playerId }) => mergePlayer(playerId, { finalizado: true, progresso: 100 }));

      assinarPlayersFinalizados(session.id, (row) => mergePlayer(row.id, {
        nome: row.nome, finalizado: row.finalizado, tempo_final: row.tempo_final,
      }));

      // rede de segurança: independe do WebSocket, garante que o ranking nunca trava
      iniciarPollingPlayers(session.id, (lista) => {
        lista.forEach((row) => mergePlayer(row.id, {
          nome: row.nome, finalizado: row.finalizado, tempo_final: row.tempo_final,
        }));
      });

      const countdownEl = $('#countdown-sessao');
      criarCountdownSessao({
        startedAtMs,
        durationSeconds: session.duration_seconds,
        offset,
        onTick: (seg) => {
          countdownEl.textContent = formatarMMSS(seg);
          countdownEl.classList.toggle('acabando', seg <= 30);
        },
        onFim: () => {
          congelado = true;
          enviarFreeze(channel); // trava novas conexões em todos os celulares
          renderTudo();
        },
      });
    }

    main();
  </script>
</body>
</html>
