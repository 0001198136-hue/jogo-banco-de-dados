<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conecta MongoDB — Telão</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{ padding:40px; }
  header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:30px; }
  header h1{ font-size:2.2rem; }
  #qr-box{ text-align:center; }
  #qr-box .card{ display:inline-block; }
  #qr-code{ background:#fff; padding:10px; border-radius:10px; }
  #room-label{ margin-top:8px; color:var(--text-dim); font-size:.9rem; }

  #end-btn{ margin-top:8px; }

  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:16px;
  }
  .player-card{
    background: var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  .player-card .pname{ font-weight:700; margin-bottom:10px; }
  .bar-track{ height:10px; border-radius:999px; background: var(--bg-card-2); overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--teal), var(--blue)); width:0%; transition: width .25s; }
  .bar-label{ margin-top:6px; font-size:.78rem; color:var(--text-dim); }
  .player-card.done{ border-color: var(--teal); }
  .player-card.done .pname::after{ content: " 🏁"; }

  #podium-screen{ display:none; text-align:center; padding-top:40px; }
  #podium-screen.show{ display:block; }
  #podium{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:24px;
    margin-top:50px;
  }
  .step{
    width:180px;
    border-radius:14px 14px 0 0;
    padding:18px 12px;
    color:#04121b;
    font-weight:800;
  }
  .step .medal{ font-size:2.2rem; }
  .step .pname{ font-size:1.1rem; margin:8px 0 4px; }
  .step .ptime{ font-size:.9rem; opacity:.8; }
  .step.gold{ background: linear-gradient(180deg, #ffe08a, #f7c94b); height:220px; order:2; }
  .step.silver{ background: linear-gradient(180deg, #e6ebf5, #c4cede); height:170px; order:1; }
  .step.bronze{ background: linear-gradient(180deg, #e5b088, #cf8c5c); height:140px; order:3; }
</style>
</head>
<body>

<div id="live-screen">
  <header>
    <div>
      <span class="pill">🖥️ Telão — Conecta MongoDB</span>
      <h1>Quem liga tudo primeiro?</h1>
    </div>
    <div id="qr-box">
      <div class="card">
        <div id="qr-code"></div>
      </div>
      <div id="room-label"></div>
      <button class="btn" id="end-btn">Encerrar e mostrar pódio</button>
    </div>
  </header>
  <div id="grid"></div>
</div>

<div id="podium-screen">
  <span class="pill">🏆 Resultado final</span>
  <h1>Pódio</h1>
  <div id="podium"></div>
  <div id="rest-list" style="margin-top:40px; max-width:500px; margin-left:auto; margin-right:auto;"></div>
</div>

<script type="module" src="js/host.js"></script>
</body>
</html>
