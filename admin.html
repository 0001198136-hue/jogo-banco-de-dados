<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conecta Ideias — Admin</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div class="tela ativa">
    <div class="admin-card">
      <h1>Conecta Ideias</h1>
      <p class="marca">Só você deveria estar nessa página</p>
      <div id="qr" class="qr" role="img" aria-label="QR code pra entrar no jogo"></div>
      <p id="url-jogo" class="marca"></p>
      <p id="contador" class="contador-jogadores">0 jogadores conectados</p>
      <button id="btn-iniciar" class="botao-principal">Iniciar sessão</button>
      <p id="status" class="marca"></p>
    </div>
  </div>

  <script type="module">
    import QRCode from 'qrcode';
    import { supabase, buscarSessaoAtiva, criarSessao } from '/src/supabaseClient.js';

    const $ = (sel) => document.querySelector(sel);
    const DURACAO_PADRAO_SEGUNDOS = 600; // 10 minutos — ajuste aqui se o slide reservar outro tempo

    async function contarJogadores(sessionId) {
      const { count } = await supabase
        .from('players')
        .select('*', { count: 'exact', head: true })
        .eq('session_id', sessionId);
      $('#contador').textContent = `${count ?? 0} jogador${count === 1 ? '' : 'es'} conectado${count === 1 ? '' : 's'}`;
    }

    async function main() {
      let session = await buscarSessaoAtiva();
      if (!session) session = await criarSessao(DURACAO_PADRAO_SEGUNDOS);

      const urlJogo = new URL('/', window.location.origin).toString();
      $('#url-jogo').textContent = urlJogo;
      // Gerado localmente (sem chamar API externa) — não depende de internet.
      // Usamos SVG (não canvas.toDataURL) porque navegadores/extensões de
      // privacidade bloqueiam extração de canvas sem interação do usuário
      // e devolvem pixels corrompidos em vez de erro (foi o bug do QR listrado).
      $('#qr').innerHTML = await QRCode.toString(urlJogo, { type: 'svg', width: 280, margin: 1 });

      const btn = $('#btn-iniciar');
      if (session.started_at) {
        btn.disabled = true;
        btn.textContent = 'Sessão já iniciada';
        $('#status').textContent = `Iniciada às ${new Date(session.started_at).toLocaleTimeString('pt-BR')}`;
      }

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { data, error } = await supabase
          .from('sessions')
          .update({ started_at: new Date().toISOString() })
          .eq('id', session.id)
          .select()
          .single();

        if (error) {
          $('#status').textContent = 'Erro ao iniciar — tenta de novo.';
          btn.disabled = false;
          return;
        }
        btn.textContent = 'Sessão iniciada';
        $('#status').textContent = `Iniciada às ${new Date(data.started_at).toLocaleTimeString('pt-BR')}`;
      });

      contarJogadores(session.id);
      setInterval(() => contarJogadores(session.id), 2000);
    }

    main();
  </script>
</body>
</html>
